<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'none'; 
                   style-src #{cspSource} 'unsafe-inline'; 
                   script-src 'nonce-#{nonce}';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="#{styleUri}" rel="stylesheet" />
    <title>DCFA Editor</title>
</head>
<body>
    <div class="tabs" id="tabsContainer"></div>
    <div id="contentsContainer"></div>

    <!-- Модальное окно -->
    <div id="objectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Настройка объекта</h3>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" data-action="closeModal">Отмена</button>
                <button data-action="saveObject">Сохранить</button>
            </div>
        </div>
    </div>

    <script nonce="#{nonce}" src="#{scriptUri}"></script>
</body>
</html>
